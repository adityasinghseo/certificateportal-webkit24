<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 90" width="280" height="90">
  <defs>
    <style>
      .logo-coral { fill: #FF4938; }
      .logo-navy { fill: #080D25; }
      .tagline { font-family: 'Inter', -apple-system, sans-serif; font-size: 11px; fill: #64748B; font-weight: 500; letter-spacing: 0.2px; }
      .brand-title { font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; font-weight: 800; font-size: 44px; letter-spacing: -1.5px; }
      .box-num { font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; font-weight: 800; font-size: 28px; line-height: 1; fill: #080D25; }
    </style>
  </defs>

  <!-- "webk" in coral -->
  <text x="2" y="48" class="brand-title logo-coral">webk</text>
  
  <!-- "i" in coral -->
  <circle cx="119" cy="20" r="4" class="logo-coral" />
  <rect x="116" y="27" width="6" height="21" rx="1.5" class="logo-coral" />

  <!-- "T" in navy -->
  <text x="126" y="48" class="brand-title logo-navy">T</text>

  <!-- Red/Coral border square box for "24" -->
  <rect x="156" y="10" width="46" height="46" rx="4" fill="none" stroke="#FF4938" stroke-width="4.5" />
  <text x="163" y="32" class="box-num">2</text>
  <text x="179" y="49" class="box-num">4</text>

  <!-- Tagline below: Innovate. Transform. Thrive. -->
  <text x="4" y="68" class="tagline">Innovate. Transform. Thrive.</text>
</svg>

